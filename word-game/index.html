<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Five Letter Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column — header, 6x5 guess board, status line, A–Z letter tray. Tiles read like wooden type blocks. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #1c2126;
  --muted: #5d6670;
  --line: #c9d0d6;
  --tile-empty: #ffffff;
  --key: #ffffff;
  --key-ink: #1c2126;
  --key-border: #aeb8c1;
  --used-key: #353c43;   /* ruled-out letters: dark and crossed out */
  --used-ink: #b3bcc4;
  --hit: #3d8b4f;      /* right letter, right spot */
  --near: #c99a1e;     /* in the word, wrong spot */
  --miss: #7a828a;     /* not in the word */
  --on-color: #ffffff;
  --font-display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --surface: #1b2026; --ink: #e8ecef; --muted: #98a2ab; --line: #343c44;
    --tile-empty: #161b20; --key: #4a5662; --key-ink: #ffffff; --key-border: #6a7783; --used-key: #0b0e11; --used-ink: #9aa5af;
    --hit: #3f9454; --near: #c49a26; --miss: #4b535b; --on-color: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --surface: #1b2026; --ink: #e8ecef; --muted: #98a2ab; --line: #343c44;
  --tile-empty: #161b20; --key: #4a5662; --key-ink: #ffffff; --key-border: #6a7783; --used-key: #0b0e11; --used-ink: #9aa5af;
  --hit: #3f9454; --near: #c49a26; --miss: #4b535b; --on-color: #ffffff; color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
header { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.4rem, 5vw, 1.9rem); letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--near); outline-offset: 2px; }
.btn {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; font-weight: 600; font-size: 0.9rem; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }

.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 7px; width: min(100%, 330px); }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.tile {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(1.5rem, 8vw, 2rem); text-transform: uppercase;
  background: var(--tile-empty); color: var(--ink); border: 2px solid var(--line); border-radius: 6px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.06);
  user-select: none;
}
.tile.filled { border-color: var(--muted); animation: pop 0.1s ease-out; }
.tile.hit, .tile.near, .tile.miss { color: var(--on-color); border-color: transparent; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
.tile.hit { background: var(--hit); }
.tile.near { background: var(--near); }
.tile.miss { background: var(--miss); }
.tile.flip { animation: flip 0.45s ease-in-out both; }
.row.shake { animation: shake 0.4s; }
.row.win .tile { animation: hop 0.5s ease both; }
@keyframes pop { from { transform: scale(0.9); } to { transform: scale(1); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .tile, .tile.flip, .row.shake, .row.win .tile { animation: none !important; } }

.status { min-height: 2.6em; text-align: center; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.status .msg { margin: 0; }
.status .msg.error { color: #b4442f; }
.status .word { font-family: var(--font-display); letter-spacing: 0.15em; font-size: 1.3rem; }

.tray { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tray-head h2 { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.alpha { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
.key {
  min-width: 0; height: 48px; border: 1.5px solid var(--key-border); border-radius: 6px; background: var(--key); color: var(--key-ink);
  font-family: var(--font-display); font-size: 1.05rem; text-transform: uppercase;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1); transition: background-color 0.2s, opacity 0.2s;
}
.key:hover { filter: brightness(0.96); }
.key.hit, .key.near { color: var(--on-color); border-color: transparent; }
.key.hit { background: var(--hit); }
.key.near { background: var(--near); }
.key.miss {
  background: var(--used-key); color: var(--used-ink); border-color: transparent; box-shadow: none;
  text-decoration: line-through; text-decoration-thickness: 2px;
}
.key.wide { grid-column: span 2; font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; text-transform: none; }
.counts { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }

.review { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
.review h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.review .lead { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
.move { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.move:first-of-type { border-top: none; padding-top: 0; }
.move-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.move-head b { font-size: 0.9rem; margin-right: 2px; }
.mini { display: flex; gap: 3px; }
.mini span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; color: var(--on-color); }
.mini .hit { background: var(--hit); } .mini .near { background: var(--near); } .mini .miss { background: var(--miss); }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.grade-hi { background: var(--hit); color: var(--on-color); }
.grade-mid { background: var(--near); color: var(--on-color); }
.grade-lo { background: #b4442f; color: #ffffff; }
.chip-outline { border: 1px solid var(--line); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; margin: 0; }
.facts div { background: var(--bg); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.facts dt { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.move-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; line-height: 1.5; }
.move-body p { margin: 0; }
.flag { color: #b4442f; }
.flag::before { content: "✗ "; font-weight: 700; }
.good::before { content: "✓ "; font-weight: 700; color: var(--hit); }
.words { font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.8rem; overflow-wrap: anywhere; }
.split { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.split span { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-family: var(--font-display); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; }
.split span.lump { border-color: #b4442f; }
.summary { border-top: 2px solid var(--ink); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; line-height: 1.5; }
.summary h3 { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.summary dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.summary dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.summary dd { margin: 0; }
.score { width: 100%; border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.score h2 { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.score-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn { background: none; border: none; color: var(--muted); font-size: 0.78rem; text-decoration: underline; padding: 4px; }
.linkbtn.confirm { color: #b4442f; font-weight: 600; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.num b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.num span { font-size: 0.75rem; color: var(--muted); }
.dist { display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.dist .lbl { color: var(--muted); font-weight: 600; text-align: right; }
.bar { background: var(--miss); color: var(--on-color); font-weight: 600; padding: 2px 8px; border-radius: 4px; text-align: right; min-width: 1.8em; width: max-content; max-width: 100%; box-sizing: border-box; }
.bar.now { background: var(--hit); }
@media (max-width: 380px) { .key { height: 42px; font-size: 0.95rem; } .alpha { gap: 4px; } }
</style>

<div class="app">
  <header>
    <div>
      <h1>Five Letter Hunt</h1>
      <p class="sub">Guess the hidden word in six tries.</p>
    </div>
    <button class="btn" id="newGame" type="button">New word</button>
  </header>

  <div class="board" id="board" aria-label="Guess board" role="grid"></div>

  <div class="status" id="status" aria-live="polite"><p class="msg">Type a five-letter word and press Enter.</p></div>

  <section class="review" id="review" aria-label="Game review" hidden></section>

  <section class="tray" aria-label="Alphabet">
    <div class="tray-head">
      <h2>Alphabet</h2>
      <div class="legend">
        <span><i style="background:var(--hit)"></i>Right spot</span>
        <span><i style="background:var(--near)"></i>Wrong spot</span>
        <span><i style="background:var(--used-key)"></i>Not in word</span>
      </div>
    </div>
    <div class="alpha" id="alpha"></div>
    <div class="counts" id="counts"></div>
  </section>

  <section class="score" aria-label="Your score">
    <div class="score-head">
      <h2>Your score</h2>
      <button class="linkbtn" id="resetStats" type="button">Reset score</button>
    </div>
    <div class="nums">
      <div class="num"><b id="sPlayed">0</b><span>Played</span></div>
      <div class="num"><b id="sWin">0</b><span>Win %</span></div>
      <div class="num"><b id="sStreak">0</b><span>Streak</span></div>
      <div class="num"><b id="sBest">0</b><span>Best streak</span></div>
    </div>
    <div>
      <h2 style="margin-bottom:8px">Solved in…</h2>
      <div class="dist" id="dist"></div>
    </div>
  </section>
</div>


<script id="engine-src">
// Assessment engine for Five Letter Hunt.
// Pure functions, no DOM. Works in the browser (window.WordEngine) and in Node (module.exports).
//
// Two dictionaries are kept separate:
//   guesses - every word the player is permitted to type
//   answers - every word the player should treat as a possible answer
// All counts, recommendations and guarantees are computed against these two lists only.
(function (root) {
  "use strict";

  const SOLVED = 242; // pattern code for five greens (2,2,2,2,2 in base 3)
  const GRADES = ["Poor", "Weak", "Fair", "Good", "Excellent", "Optimal"];

  // Estimated further guesses needed to finish once k answers remain (including the guess that solves).
  // Exact for k = 1 and 2; a calibrated estimate above that. Used only to compare moves, never to claim guarantees.
  const finishCost = k => (k <= 1 ? 1 : 1.5 + 0.21 * Math.log(k - 1));

  function createEngine(opts) {
    const guesses = opts.guesses, answers = opts.answers;
    const G = guesses.length, A = answers.length;
    const gIndex = new Map(), aIndex = new Map();
    const gCodes = new Uint8Array(G * 5), aCodes = new Uint8Array(A * 5);
    guesses.forEach((w, i) => { gIndex.set(w, i); for (let k = 0; k < 5; k++) gCodes[i * 5 + k] = w.charCodeAt(k) - 97; });
    answers.forEach((w, i) => { aIndex.set(w, i); for (let k = 0; k < 5; k++) aCodes[i * 5 + k] = w.charCodeAt(k) - 97; });
    const ansToGuess = new Int32Array(A).fill(-1);
    answers.forEach((w, i) => { const g = gIndex.get(w); if (g !== undefined) ansToGuess[i] = g; });
    const openers = opts.openers || null;

    // ---- Exact feedback rules (greens first, then yellows limited by unmatched letters) ----
    const PC = new Uint8Array(26), PR = new Uint8Array(5);
    function pattern(gi, ai) {
      const g = gi * 5, a = ai * 5;
      for (let i = 0; i < 5; i++) { PC[aCodes[a + i]] = 0; PC[gCodes[g + i]] = 0; }
      for (let i = 0; i < 5; i++) {
        const gc = gCodes[g + i], ac = aCodes[a + i];
        if (gc === ac) PR[i] = 2; else { PR[i] = 0; PC[ac]++; }
      }
      let p = 0;
      for (let i = 0; i < 5; i++) {
        if (PR[i] !== 2) { const gc = gCodes[g + i]; if (PC[gc] > 0) { PR[i] = 1; PC[gc]--; } }
        p = p * 3 + PR[i];
      }
      return p;
    }
    const patternToColors = p => { const out = []; for (let i = 4; i >= 0; i--) { out[i] = ["miss", "near", "hit"][p % 3]; p = Math.floor(p / 3); } return out; };

    // ---- Statistics of one guess against a set of possible answers ----
    const CNT = new Int32Array(243);
    function fillCounts(gi, set) { CNT.fill(0); for (let j = 0; j < set.length; j++) CNT[pattern(gi, set[j])]++; }
    function summarize(n) {
      let sq = 0, worst = 0, groups = 0, cost = 0;
      for (let p = 0; p < 243; p++) {
        const k = CNT[p]; if (!k) continue;
        groups++; sq += k * k; if (k > worst) worst = k;
        if (p !== SOLVED) cost += k * finishCost(k);
      }
      return { expected: sq / n, worst, groups, isCandidate: CNT[SOLVED] > 0, solveChance: CNT[SOLVED] / n, eg: 1 + cost / n };
    }
    function stats(gi, set) {
      fillCounts(gi, set);
      const s = summarize(set.length);
      s.word = guesses[gi]; s.gi = gi;
      return s;
    }
    function buckets(gi, set) {
      const m = new Map();
      for (const a of set) { const p = pattern(gi, a); if (!m.has(p)) m.set(p, []); m.get(p).push(a); }
      return m;
    }

    // Score every permitted guess against the set (cost: guesses x answers).
    function scanAll(set) {
      const n = set.length;
      const eg = new Float64Array(G), expected = new Float64Array(G);
      const worst = new Int32Array(G), groups = new Int32Array(G), cand = new Uint8Array(G);
      for (let gi = 0; gi < G; gi++) {
        fillCounts(gi, set);
        const s = summarize(n);
        eg[gi] = s.eg; expected[gi] = s.expected; worst[gi] = s.worst; groups[gi] = s.groups; cand[gi] = s.isCandidate ? 1 : 0;
      }
      return { eg, expected, worst, groups, cand };
    }
    const byInfo = sc => (a, b) => sc.eg[a] - sc.eg[b] || sc.cand[b] - sc.cand[a] || sc.worst[a] - sc.worst[b];
    const bySafety = sc => (a, b) => sc.worst[a] - sc.worst[b] || sc.eg[a] - sc.eg[b] || sc.cand[b] - sc.cand[a];
    function topBy(sc, cmp, k) { const idx = Array.from({ length: G }, (_, i) => i); idx.sort(cmp(sc)); return idx.slice(0, k); }

    // ---- Recursive guarantee search ----
    // canSolve(set, t): can every answer in `set` be found within t more guesses?
    // Returns true (verified), false (proven impossible) or null (not determined within the search limits).
    const OUT_OF_BUDGET = { budget: true };
    let budget = 0;
    const memo = new Map();
    const SEEN = new Int32Array(243); let stamp = 0;
    function splitsFully(gi, set) {
      stamp++;
      for (const a of set) { const p = pattern(gi, a); if (SEEN[p] === stamp) return false; SEEN[p] = stamp; }
      return true;
    }
    function canSolve(set, t) {
      const n = set.length;
      if (n === 0) return true;
      if (n === 1) return t >= 1;
      if (t <= 1) return false;
      if (t === 2 && n > 243) return false;
      const key = t + ":" + set.join(",");
      if (memo.has(key)) return memo.get(key);
      let res;
      if (t === 2) {
        // Needs one guess that gives every remaining answer its own color pattern. Exhaustive search.
        res = false;
        for (const a of set) { const gi = ansToGuess[a]; if (gi >= 0 && splitsFully(gi, set)) { res = true; break; } }
        if (!res) {
          budget -= G * n; if (budget < 0) throw OUT_OF_BUDGET;
          for (let gi = 0; gi < G; gi++) if (splitsFully(gi, set)) { res = true; break; }
        }
      } else {
        // Try the most promising guesses; a found strategy is a real proof, a miss is left undetermined.
        budget -= G * n; if (budget < 0) throw OUT_OF_BUDGET;
        const sc = scanAll(set);
        const tries = [...new Set([...topBy(sc, bySafety, t >= 4 ? 2 : 4), ...topBy(sc, byInfo, t >= 4 ? 1 : 2)])];
        res = null;
        for (const gi of tries) { if (guaranteesAfter(gi, set, t) === true) { res = true; break; } }
      }
      memo.set(key, res);
      return res;
    }
    // If the player guesses gi now with t turns left (including this one), is a win guaranteed?
    function guaranteesAfter(gi, set, t) {
      if (t < 1) return false;
      const bs = [...buckets(gi, set).entries()].filter(([p]) => p !== SOLVED).map(([, b]) => b);
      if (!bs.length) return true;
      bs.sort((x, y) => y.length - x.length);
      let unknown = false;
      for (const b of bs) {
        const r = canSolve(b, t - 1);
        if (r === false) return false;
        if (r !== true) unknown = true;
      }
      return unknown ? null : true;
    }
    function safeGuarantee(gi, set, t, limit) {
      budget = limit;
      try { return guaranteesAfter(gi, set, t); }
      catch (e) { if (e === OUT_OF_BUDGET) return null; throw e; }
    }

    const VERIFY_LIMIT = 400; // above this many answers, guarantees are not searched

    // ---- Analyze one decision ----
    // set: sorted answer indices still possible; T: turns left including this one; userGi: the guess played.
    function analyzePosition(set, T, userGi, answerIdx) {
      const n = set.length;
      memo.clear();
      const user = stats(userGi, set);
      user.pWin = T === 1 ? user.solveChance : T === 2 ? user.groups / n : null;
      const atOpening = openers && n === A;
      let sc = null, alts;
      if (atOpening) {
        alts = openers.map(o => Object.assign({}, o, { gi: gIndex.get(o.word) }));
      } else {
        if (n > 2500) {
          // Very large lists: shortlist on an evenly spaced sample, then measure the shortlist exactly.
          const step = n / 2000, sample = [];
          for (let i = 0; i < 2000; i++) sample.push(set[Math.floor(i * step)]);
          const ssc = scanAll(sample);
          alts = topBy(ssc, byInfo, 20).map(gi => stats(gi, set));
        } else sc = scanAll(set);
        if (sc) alts = [...new Set([...topBy(sc, byInfo, 8), ...topBy(sc, bySafety, 6), ...(T === 2 ? topBy(sc, s => (a, b) => s.groups[b] - s.groups[a] || s.cand[b] - s.cand[a] || s.eg[a] - s.eg[b], 6) : [])])];
        if (sc) alts = alts.map(gi => stats(gi, set));
      }
      alts.forEach(a => { a.pWin = T === 1 ? a.solveChance : T === 2 ? a.groups / n : null; });

      // Guarantees
      let guaranteeAvailable = null;
      if (n === 1) { guaranteeAvailable = true; user.guaranteed = user.isCandidate; alts.forEach(a => a.guaranteed = a.isCandidate); }
      else if (T === 1) { guaranteeAvailable = false; user.guaranteed = false; alts.forEach(a => a.guaranteed = false); }
      else if (T === 2) {
        // Exact: a guarantee needs a guess that gives every answer its own pattern.
        user.guaranteed = user.groups === n;
        alts.forEach(a => a.guaranteed = a.groups === n);
        guaranteeAvailable = n <= 243 && sc ? sc.groups.some(g => g === n) : false;

        };`;
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      worker.onmessage = ev => { const cb = pending.get(ev.data.id); pending.delete(ev.data.id); if (cb) cb(ev.data); };
      worker.onerror = () => { workerFailed = true; worker = null; pending.forEach(cb => cb({ fallback: true })); pending.clear(); };
      worker.postMessage({ init: true, words: VALID_STR.split(" "), openers: OPENERS });
    } catch (e) { workerFailed = true; worker = null; }
    return worker;
  }
  function analyze(guesses, answer) {
    const key = guesses.join(",") + ">" + answer;
    if (reviewCache.has(key)) return Promise.resolve(reviewCache.get(key));
    const runSync = () => {
      if (!syncEngine) syncEngine = window.WordEngine.createEngine({ guesses: VALID_STR.split(" "), answers: VALID_STR.split(" "), openers: OPENERS });
      return syncEngine.reviewGame(guesses, answer, 6);
    };
    return new Promise((resolve, reject) => {
      const w = getWorker();
      const done = r => { reviewCache.set(key, r); resolve(r); };
      if (!w) { setTimeout(() => { try { done(runSync()); } catch (e) { reject(e); } }, 30); return; }
      const id = ++reqId;
      pending.set(id, d => {
        if (d.fallback) { try { done(runSync()); } catch (e) { reject(e); } }
        else if (d.error) reject(new Error(d.error)); else done(d.result);
      });
      w.postMessage({ id, guesses, answer });
    });
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const W = w => `<span class="words">${esc(w)}</span>`;
  const plural = (n, w, ws) => `${n.toLocaleString()} ${n === 1 ? w : (ws || w + "s")}`;
  const num = x => x >= 100 ? Math.round(x).toLocaleString() : x >= 10 ? x.toFixed(1) : x.toFixed(2);
  const pct = x => Math.round(x * 100) + "%";
  const gradeClass = g => ({ Optimal: "grade-hi", Excellent: "grade-hi", Good: "grade-mid", Fair: "grade-mid", Weak: "grade-lo", Poor: "grade-lo" })[g];
  const splitHTML = groups => `<div class="split">${groups.map(g => `<span class="${g.words.length > 1 ? "lump" : ""}">${g.words.map(esc).join(" · ")}</span>`).join("")}</div>`;
  const guarText = (g, T) => g === true ? "Yes" : g === false ? "No" : "Not verified";
  const turnsLeftText = T => T === 1 ? "this turn" : `${T} turns (this one included)`;

  function moveHTML(m) {
    const u = m.user, b = m.best;
    const tiles = [...u.word].map((ch, k) => `<span class="${state.fbCache[m.index][k]}">${esc(ch)}</span>`).join("");
    const head = `<div class="move-head"><b>Guess ${m.index + 1}</b><div class="mini">${tiles}</div>
      <span class="chip ${gradeClass(m.grade)}">${m.grade}</span>
      <span class="chip chip-outline">${esc(m.designation)}</span>
      <span class="chip chip-outline">Luck: ${esc(m.luck.label)}</span></div>`;
    const after = m.solved ? "Solved" : m.afterCount.toLocaleString();
    const canBe = u.isCandidate ? `Yes (1 in ${m.n.toLocaleString()})` : "No";
    let guarAvail;
    if (m.n === 1) guarAvail = "Forced answer";
    else if (m.T === 1) guarAvail = "No (last turn)";
    else if (m.guaranteeAvailable === true) guarAvail = "Yes, verified";
    else if (m.guaranteeAvailable === false) guarAvail = "No";
    else guarAvail = m.n > 400 ? "Too early to check" : "None found";
    const facts = `<dl class="facts">
      <div><dt>Possible before</dt><dd>${m.n.toLocaleString()}</dd></div>
      <div><dt>Possible after</dt><dd>${after}</dd></div>
      <div><dt>Expected left</dt><dd>${num(u.expected)}</dd></div>
      <div><dt>Worst case</dt><dd>${u.worst.toLocaleString()}</dd></div>
      <div><dt>Could be answer</dt><dd>${canBe}</dd></div>
      <div><dt>Guaranteed win available</dt><dd>${guarAvail}</dd></div>
      ${m.T >= 2 && m.n > 1 && m.n <= 400 ? `<div><dt>Your guess keeps a guarantee</dt><dd>${guarText(u.guaranteed)}</dd></div>` : ""}
      ${m.T === 2 && m.n > 1 ? `<div><dt>Win chance from here</dt><dd>${pct(u.pWin)}</dd></div>` : ""}
    </dl>`;
    const lines = [];
    if (m.candidatesBefore && m.n > 1) lines.push(`<p>Possible answers: ${W(m.candidatesBefore.join(", "))}</p>`);
    // What went right or wrong in the decision
    if (m.reason === "missedForced") lines.push(`<p class="flag">Only ${W(m.candidatesBefore[0])} fit your clues. Any other word wastes a turn.</p>`);
    else if (m.reason === "finalNotAnswer") lines.push(`<p class="flag">On the last turn only a possible answer can win, and ${W(u.word)} wasn't one.</p>`);
    else if (m.reason === "noInfo") lines.push(`<p class="flag">Every possible answer would show the same colors for ${W(u.word)}, so it couldn't tell any of them apart.</p>`);
    else if (m.reason === "lostGuarantee") lines.push(`<p class="flag">A guaranteed win was available with ${turnsLeftText(m.T)}, but ${W(u.word)} left a chance of running out of turns.</p>`);
    if (m.n === 1 && u.isCandidate) lines.push(`<p class="good">Only one word fit, and you played it.</p>`);
    else if (m.T === 1 && u.isCandidate) lines.push(`<p class="good">Last turn, and you played a possible answer: the best you could do was a 1-in-${m.n} shot.</p>`);
    else if (m.isUserBest || m.grade === "Optimal") lines.push(`<p class="good">Among the best moves available here.</p>`);
    // Best alternative and why
    if (b && !m.isUserBest && m.grade !== "Optimal" && m.n > 1) {
      const why = [];
      if (m.n === 1 || m.T === 1) {
        why.push(`play a word that can still win: ${W(m.candidatesBefore ? m.candidatesBefore.join(", ") : b.word)}.`);
      } else {
        if (b.guaranteed === true && u.guaranteed !== true) why.push(`it guarantees a win within ${turnsLeftText(m.T)}`);
        if (m.T === 2) why.push(`your win chance would be ${pct(b.pWin)} instead of ${pct(u.pWin)}`);
        why.push(`it splits the ${plural(m.n, "answer")} into ${b.groups} groups (largest ${b.worst}, about ${num(b.expected)} left on average); yours made ${u.groups} (largest ${u.worst}, about ${num(u.expected)})`);
        if (b.isCandidate && !u.isCandidate) why.push(`it could also have been the answer itself`);
      }
      lines.push(`<p><b>Better option:</b> ${W(b.word)}${m.alternatives.length > 1 ? ` (also good: ${W(m.alternatives.filter(a => a.word !== b.word).slice(0, 2).map(a => a.word).join(", "))})` : ""}. ${m.n === 1 || m.T === 1 ? "On this turn, " + why[0] : "It's stronger because " + why.join("; ") + "."}</p>`);
      if (m.bestGroups && m.userGroups && m.T > 1) {
        lines.push(`<p>How ${W(b.word)} would sort them:</p>${splitHTML(m.bestGroups)}`);
        lines.push(`<p>How ${W(u.word)} sorted them (outlined in red: words it couldn't tell apart):</p>${splitHTML(m.userGroups)}`);
      }
    }
    if (m.afterWords && m.afterWords.length > 1) lines.push(`<p>Left after the colors: ${W(m.afterWords.join(", "))}</p>`);
    return `<div class="move">${head}${facts}<div class="move-body">${lines.join("")}</div></div>`;
  }

  function summaryHTML(rev) {
    const ms = rev.moves;
    const result = rev.won ? `Solved in ${plural(ms.length, "guess", "guesses")}.` : `Not solved. The word was ${W(rev.answer)}.`;
    const avg = ms.reduce((s, m) => s + m.gradeScore, 0) / ms.length;
    const counts = ["Optimal", "Excellent", "Good", "Fair", "Weak", "Poor"].map(g => [g, ms.filter(m => m.grade === g).length]).filter(([, n]) => n).map(([g, n]) => `${n} ${g.toLowerCase()}`).join(", ");
    const quality = (avg >= 4.5 ? "Excellent. " : avg >= 3.5 ? "Good. " : avg >= 2.5 ? "Mixed. " : "Needs work. ") + `Your moves: ${counts}.`;
    const lucky = ms.filter(m => m.luck && m.luck.label !== "No luck involved" && m.n > 1);
    let luckText = "No luck involved: every guess had only one possible outcome.";
    if (lucky.length) {
      const q = lucky.reduce((s, m) => s + m.luck.q, 0) / lucky.length;
      const label = q < 0.2 ? "Very favorable" : q < 0.4 ? "Favorable" : q <= 0.6 ? "Typical" : q <= 0.8 ? "Unfavorable" : "Very unfavorable";
      const ex = lucky.slice().sort((a, b) => Math.abs(b.luck.q - 0.5) - Math.abs(a.luck.q - 0.5))[0];
      luckText = `${label} overall.` + (Math.abs(ex.luck.q - 0.5) > 0.2 ? ` Biggest swing: guess ${ex.index + 1} (${W(ex.user.word)}) left ${ex.solved ? "nothing (solved)" : ex.afterCount.toLocaleString()} when about ${num(ex.user.expected)} was typical.` : "");
    }
    const risky = ms.filter(m => m.designation === "Risky" || m.reason === "missedForced");
    const secured = ms.find(m => m.n > 1 && m.user.guaranteed === true);
    let risk;
    if (risky.length) risk = risky.map(m => m.reason === "missedForced" ? `Guess ${m.index + 1}: only one word fit, but you played ${W(m.user.word)}.` : m.reason === "finalNotAnswer" ? `Guess ${m.index + 1}: your last guess couldn't have been the answer.` : `Guess ${m.index + 1}: ${W(m.user.word)} gave up a guaranteed win (${W(m.best.word)} kept it).`).join(" ");
    else if (secured) risk = `No avoidable risks. From guess ${secured.index + 1} (${W(secured.user.word)}) your win was guaranteed with correct play.`;
    else risk = "No avoidable risks taken.";
    const tp = ms.slice().sort((a, b) => b.cost - a.cost)[0];
    let turning, improve;
    if (tp && tp.cost > 0.05) {
      turning = `Guess ${tp.index + 1}, ${W(tp.user.word)} (${tp.grade.toLowerCase()}) with ${plural(tp.n, "possible answer")} left.`;
      const b = tp.best;
      if (tp.reason === "missedForced") improve = `On guess ${tp.index + 1} only ${W(tp.candidatesBefore[0])} fit. Before you type, check your word against every green, yellow and gray clue so far.`;
      else if (tp.reason === "finalNotAnswer") improve = `On your final guess, choose only from words that still fit: ${W((tp.candidatesBefore || [b.word]).join(", "))}.`;
      else if (tp.reason === "noInfo") improve = `On guess ${tp.index + 1}, ${W(tp.user.word)} gave the same colors for every possible answer. ${W(b.word)} would have split the ${plural(tp.n, "answer")} into ${b.groups} groups. Before playing a scouting word, check that its letters differ across the words still in play.`;
      else if (tp.bestGroups) improve = `On guess ${tp.index + 1} the answers were ${W(tp.candidatesBefore.join(", "))}. ${W(tp.user.word)} left ${tp.userGroups.filter(g => g.words.length > 1).map(g => W(g.words.join(" & "))).join(", ") || "some"} together; ${W(b.word)} would have separated ${b.groups === tp.n ? "all of them" : `them into ${b.groups} groups`}. When few words remain, look for the letter positions where they differ and pick a word that tests those.`;
      else improve = `On guess ${tp.index + 1}, ${W(b.word)} would have left about ${num(b.expected)} answers on average (worst ${b.worst.toLocaleString()}) versus about ${num(tp.user.expected)} (worst ${tp.user.worst.toLocaleString()}) for ${W(tp.user.word)}.` + (tp.index === 0 ? " An opener built from the most common letters in their most common spots, like TARES or LARES, cuts the field much further." : ` With ${plural(tp.n, "answer")} left, pick a word that tests several unconfirmed common letters in new spots, even if it can't be the answer.`);
    } else {
      turning = "No single decision cost you much. Every move was close to the best available.";
      const near = ms.filter(m => !m.isUserBest && m.best && m.n > 1 && m.T > 1).sort((a, b) => b.cost - a.cost)[0];
      improve = near ? `Your closest call was guess ${near.index + 1}: ${W(near.best.word)} was slightly better than ${W(near.user.word)} (about ${num(near.best.expected)} vs ${num(near.user.expected)} answers left on average).` : "Every move was the best available. Nothing to fix in this game.";
    }
    return `<div class="summary"><h3>Summary</h3><dl>
      <div><dt>Result</dt><dd>${result}</dd></div>
      <div><dt>Strategic quality</dt><dd>${quality}</dd></div>
      <div><dt>Luck</dt><dd>${luckText}</dd></div>
      <div><dt>Risk management</dt><dd>${risk}</dd></div>
      <div><dt>Turning point</dt><dd>${turning}</dd></div>
      <div><dt>Improvement opportunity</dt><dd>${improve}</dd></div>
    </dl></div>`;
  }

  function renderReview() {
    const el = document.getElementById("review");
    if (!state.done || !state.guesses.length) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    const lead = `<p class="lead">Each guess is graded only on what you knew before playing it, against all ${TOTAL_WORDS.toLocaleString()} allowed words, each treated as an equally likely answer. Luck is reported separately and never changes a grade.</p>`;
    el.innerHTML = `<h2>Game review</h2>${lead}<p class="lead"><b>Analyzing your moves…</b></p>`;
    const g = state.guesses.slice(), a = state.answer;
    state.fbCache = g.map(w => score(w, a));
    analyze(g, a).then(rev => {
      if (state.answer !== a || state.guesses.length !== g.length) return;
      el.innerHTML = `<h2>Game review</h2>${lead}${rev.moves.map(moveHTML).join("")}${summaryHTML(rev)}`;
    }).catch(err => {
      el.innerHTML = `<h2>Game review</h2><p class="lead">The review couldn't be completed (${esc(err.message)}). Start a new game and try again.</p>`;
    });
  }

  function freshState() {
    return { answer: ANSWERS[Math.floor(Math.random() * ANSWERS.length)], guesses: [], current: "", done: false, won: false };
  }

  function letterStates() {
    const out = {};
    for (const g of state.guesses) {
      const s = score(g, state.answer);
      for (let i = 0; i < COLS; i++) {
        const c = g[i];
        if (!out[c] || RANK[s[i]] > RANK[out[c]]) out[c] = s[i];
      }
    }
    return out;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement("div");
      row.className = "row"; row.setAttribute("role", "row");
      for (let c = 0; c < COLS; c++) {
        const t = document.createElement("div");
        t.className = "tile"; t.setAttribute("role", "gridcell");
        row.appendChild(t);
      }
      boardEl.appendChild(row);
    }
  }

  function buildAlpha() {
    alphaEl.innerHTML = "";
    const letters = "abcdefghijklmnopqrstuvwxyz".split("");
    letters.forEach(ch => alphaEl.appendChild(makeKey(ch, ch)));
    alphaEl.appendChild(makeKey("back", "⌫ Delete", true));
    alphaEl.appendChild(makeKey("enter", "Enter", true));
  }
  function makeKey(val, label, wide) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key" + (wide ? " wide" : "");
    b.dataset.key = val; b.textContent = label;
    b.addEventListener("click", () => { press(val); b.blur(); });
    return b;
  }

  function paintRow(r, animate) {
    const row = boardEl.children[r];
    const g = state.guesses[r];
    const s = score(g, state.answer);
    [...row.children].forEach((t, i) => {
      t.textContent = g[i];
      const apply = () => { t.className = "tile " + s[i]; t.setAttribute("aria-label", g[i] + " " + ({hit:"right spot",near:"wrong spot",miss:"not in word"})[s[i]]); };
      if (animate && !reduced) {
        setTimeout(() => { t.classList.add("flip"); setTimeout(apply, 220); }, i * 260);
      } else apply();
    });
  }

  function paintCurrent() {
    const r = state.guesses.length;
    if (r >= ROWS) return;
    const row = boardEl.children[r];
    [...row.children].forEach((t, i) => {
      const ch = state.current[i] || "";
      t.textContent = ch;
      t.className = "tile" + (ch ? " filled" : "");
    });
  }

  function paintAlpha() {
    const ls = letterStates();
    let unused = 0;
    alphaEl.querySelectorAll(".key").forEach(k => {
      const v = k.dataset.key;
      if (v.length !== 1) return;
      k.className = "key" + (ls[v] ? " " + ls[v] : "");
      if (!ls[v]) unused++;
      k.setAttribute("aria-label", v.toUpperCase() + (ls[v] ? ", " + ({hit:"right spot",near:"in word, wrong spot",miss:"not in word"})[ls[v]] : ", not tried yet"));
    });
    countsEl.textContent = `${unused} letters not tried yet · guess ${Math.min(state.guesses.length + (state.done ? 0 : 1), ROWS)} of ${ROWS}`;
  }

  function say(text, opts = {}) {
    statusEl.innerHTML = "";
    const p = document.createElement("p");
    p.className = "msg" + (opts.error ? " error" : "");
    p.textContent = text;
    statusEl.appendChild(p);
    if (opts.word) {
      const w = document.createElement("div"); w.className = "word"; w.textContent = state.answer.toUpperCase();
      statusEl.appendChild(w);
    }
    if (opts.again) {
      const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Play again";
      b.addEventListener("click", newGame); statusEl.appendChild(b);
    }
  }

  function shake() {
    const row = boardEl.children[state.guesses.length];
    row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
  }

  let busy = false;
  function submit() {
    if (state.current.length < COLS) { say("Not enough letters. Fill all five boxes.", { error: true }); shake(); return; }
    if (!VALID.has(state.current)) { say(`"${state.current.toUpperCase()}" isn't in the word list. Try another word.`, { error: true }); shake(); return; }
    const r = state.guesses.length;
    state.guesses.push(state.current); state.current = "";
    busy = true;
    paintRow(r, true);
    const delay = reduced ? 0 : COLS * 260 + 250;
    setTimeout(() => {
      busy = false;
      paintAlpha();
      const last = state.guesses[r];
      if (last === state.answer) {
        state.done = true; state.won = true;
        const praise = ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"][r];
        say(`${praise} Solved in ${r + 1} ${r === 0 ? "guess" : "guesses"}.`, { again: true });
        if (!reduced) boardEl.children[r].classList.add("win");
        recordResult();
      } else if (state.guesses.length === ROWS) {
        state.done = true;
        recordResult();
        say("Out of guesses. The word was:", { word: true, again: true });
      } else {
        say(`${ROWS - state.guesses.length} ${ROWS - state.guesses.length === 1 ? "guess" : "guesses"} left.`);
      }
      paintAlpha();
      paintStats();
      renderReview();
    }, delay);
  }

  function press(k) {
    if (state.done || busy) return;
    if (k === "enter") return submit();
    if (k === "back") { state.current = state.current.slice(0, -1); paintCurrent(); return; }
    if (/^[a-z]$/.test(k) && state.current.length < COLS) { state.current += k; paintCurrent(); }
  }

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
    const k = e.key.toLowerCase();
    if (k === "enter") { e.preventDefault(); press("enter"); }
    else if (k === "backspace") { e.preventDefault(); press("back"); }
    else if (/^[a-z]$/.test(k)) press(k);
  });

  function render() {
    buildBoard();
    state.guesses.forEach((_, r) => paintRow(r, false));
    paintCurrent();
    paintAlpha();
    paintStats();
    renderReview();
    if (state.done) {
      if (state.won) say(`Solved in ${state.guesses.length} ${state.guesses.length === 1 ? "guess" : "guesses"}.`, { again: true });
      else say("Out of guesses. The word was:", { word: true, again: true });
    } else if (state.guesses.length) say(`${ROWS - state.guesses.length} guesses left.`);
    else say("Type a five-letter word and press Enter.");
  }

  function newGame() {
    if (!state.done && state.guesses.length > 0) { state.done = true; state.won = false; recordResult(); }
    state = freshState(); render();
  }
  document.getElementById("newGame").addEventListener("click", e => { newGame(); e.currentTarget.blur(); });

  function start(saved) {
    buildAlpha();
    state = saved && saved.state && saved.state.answer ? saved.state : freshState();
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
